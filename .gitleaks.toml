# Secret-scan policy for `make secret-scan` and CI's secret-scan job.
#
# This file is the whole policy. It is read by the same gitleaks invocation
# locally and in CI, so an exemption is argued for in the pull request that
# needs it.
#
# An entry earns its place by naming why the match is not a credential. Prefer a
# scoped allowlist (a path AND a pattern) over a bare path exclusion: a whole
# file waved through stops being scanned for the real thing.
#
# A scoped exemption takes THREE elements, and dropping any ONE of them widens it
# to the whole file:
#
#   targetRules       Without it the entry is GLOBAL: gitleaks skips the file
#                     before it reads a line, so `condition` never gets the
#                     chance to narrow anything and the exemption covers every
#                     rule.
#   regexes           Without it the entry excuses the whole path for its rule —
#                     `paths` alone is a file exclusion wearing a rule's name.
#   condition = "AND" Without it the condition defaults to OR, and matching the
#                     PATH alone is then enough. Same result as no regexes at
#                     all, from an omission that looks like formatting.
#
# With all three, the file stays scanned — for the other rules AND for the
# excused rule on every line the regex does not name. That is the property
# scripts/secret-scan.test.sh holds. Any new scoped exemption gets a planted case
# there. An allowlist nobody planted against is exactly the one that is
# over-broad.

[extend]
useDefault = true

# Tests hold fabricated fixtures — stand-in tokens, demo ids, and deliberately
# malformed values. Their literals exist so the code under test can encode,
# decode or refuse them, so a fixture HAS to look like a credential for the test
# to mean anything.
[[allowlists]]
description = "Fabricated fixtures in tests"
paths = [
  '''_test\.go$''',
  '''\.test\.tsx?$''',
]
