# Secret-scan policy for `make secret-scan` and CI's secret-scan job.
#
# This file is the whole policy. It is read by the same gitleaks invocation
# locally and in CI, so an exemption is argued for in the pull request that
# needs it.
#
# An entry earns its place by naming why the match is not a credential. Prefer a
# scoped allowlist (a path AND a pattern) over a bare path exclusion: a whole
# file waved through stops being scanned for the real thing.
#
# A scoped exemption takes THREE elements, and dropping any ONE of them widens it
# to the whole file:
#
#   targetRules       Without it the entry is GLOBAL: gitleaks skips the file
#                     before it reads a line, so `condition` never gets the
#                     chance to narrow anything and the exemption covers every
#                     rule.
#   regexes           Without it the entry excuses the whole path for its rule —
#                     `paths` alone is a file exclusion wearing a rule's name.
#   condition = "AND" Without it the condition defaults to OR, and matching the
#                     PATH alone is then enough. Same result as no regexes at
#                     all, from an omission that looks like formatting.
#
# With all three, the file stays scanned — for the other rules AND for the
# excused rule on every line the regex does not name. That is the property
# scripts/secret-scan.test.sh holds, by planting a token of the excused rule on a
# line the regex does not match. An allowlist nobody planted against is exactly
# the one that is over-broad.

[extend]
useDefault = true

# Tests hold fabricated fixtures — stand-in tokens, demo ids, and deliberately
# malformed values. The clearest case here is zalo-personal's crypto and capture
# tests: their literals exist so the code under test can encode, decode or refuse
# them, so a fixture HAS to look like a credential for the test to mean anything.
#
# A bare path exclusion rather than a scoped one, matching core's own policy for
# the same paths. It is the one place a whole-file exclusion is defensible: the
# argument is about the KIND of file rather than about one line in it, and a test
# is not a place a live credential belongs at all. What it costs is real — a
# genuine key pasted into a _test.go file would not fail this gate — and the
# reason it is accepted is that narrowing it would mean one entry per fixture,
# each stale the moment a test changes.
[[allowlists]]
description = "Fabricated fixtures in tests"
paths = [
  '''_test\.go$''',
  '''\.test\.tsx?$''',
]

# `zcidKey` — the fixed key Zalo Web ships in its OWN public JavaScript bundle to
# encrypt the zcid before login. It is a constant of somebody else's client,
# transcribed so our handshake produces the bytes their server expects; it
# authenticates nothing, and it is as public as the minified script any browser
# downloads from Zalo. Rotating it is not a thing we can do or would want to:
# changing it means the server refuses every login.
#
# This exemption lived in core/.gitleaks.toml until zalo-personal moved here. It
# moved with the unit rather than lapsing, because it is a CONTROL and not noise
# suppression: zalocrypto.go handles real session keys, so it must keep being
# scanned for everything except this one published constant.
[[allowlists]]
description = "Zalo Web's own published zcid key, transcribed into the personal connector"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''extensions/zalo-personal/zalocrypto\.go$''']
regexes = ['''3FC4F0D2AB50057BCE0D90D9187A22B1''']
