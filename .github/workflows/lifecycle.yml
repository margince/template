# The instance lifecycle, end to end: create an instance from this template,
# add and test a unit, deploy it through the hook adapter (a success and a
# rollback), and merge a template change into it. `scripts/lifecycle.test.sh`
# asserts every step's outcome, so a green run here proves the template still
# produces a working instance, not merely that the template itself composes.
#
# Separate from ci.yml because it is slow — it runs `make install`, creates a
# whole instance, composes and tests a unit, and drives two deployments —
# where ci.yml's job answers in well under a minute. Splitting it out keeps
# the fast gate fast without dropping the slow one.
#
# Release and host deployment steps are part of `scripts/lifecycle.test.sh`.
# Trial is covered separately, by `scripts/trial.test.sh` (run under
# `make test-scripts`, not by this workflow).
#
# `.github/workflows/` is template-owned (.template-owned), so every instance
# inherits this file unchanged and check-template rejects removing it. In an
# instance, `make new-instance` always errors ("this is an instance"), so the
# job must not run there.
#
# That used to be a job-level `if:`, but a job-level `if:` runs before any
# checkout and cannot call `hashFiles()` — there is nothing on the runner yet
# to hash. So the guard is a per-step output instead: the first step checks
# out WITHOUT submodules (cheap enough for an instance to pay for too), the
# second reads whether `.template-version` exists into a step output, and
# every step after that — including the submodule init — repeats
# `if: steps.template.outputs.template == 'true'`. A skipped step reports
# neutral, not failed, the same as the job-level guard did.
name: lifecycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0, unlike ci.yml's checkout: full history avoids
      # shallow-repository edge cases when the test clones this checkout.
      # NO submodules here: this step alone must run in every instance too,
      # only to learn that the rest of the job does not apply to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Is this the template
        id: template
        shell: bash
        run: |
          if [ -f .template-version ]; then
            echo "template=false" >> "$GITHUB_OUTPUT"
          else
            echo "template=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out submodules
        if: steps.template.outputs.template == 'true'
        shell: bash
        run: git submodule update --init --recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.template.outputs.template == 'true'
        with:
          go-version-file: core/backend/go.mod
          cache-dependency-path: core/backend/go.sum

      # Node and pnpm: `make install` runs core's own install, and the
      # composed unit the test adds is built and tested through `make u`.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.template.outputs.template == 'true'
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.template.outputs.template == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: The instance lifecycle
        if: steps.template.outputs.template == 'true'
        shell: bash
        run: make test-lifecycle
