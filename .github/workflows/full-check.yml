# The full gate, as ONE definition the release lane calls.
#
# It is ci.yml's light set PLUS the four lanes that left it: the screen suites,
# the composed typecheck, and the two that arm a real Postgres. `make ci` locally
# is the same superset; keep the three in step.
#
# Reusable rather than copied. It has one caller today — release.yml — and a
# copy would still be the wrong shape: docs/release.md's standing warning about
# keeping the lanes in step is a promise a copy cannot keep. A second copy would
# drift on the first gate anyone adds, and be discovered by a release that passed
# something main rejects.
name: full-check

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          The commit to gate. A caller resolves its tag to a SHA once and hands
          the SHA to every job, so the gate and the bundles are the same tree.
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: the full gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/backend/go.mod
          cache-dependency-path: core/backend/go.sum

      ## The first gate step, right after the Go setup it needs and before the
      ## node/pnpm setup and the build steps below: a bad instance.yaml fails
      ## in seconds and says nothing about the composed tree, so nothing else
      ## here should have to run first to find that out.
      - name: instance.yaml is valid
        run: make check-instance

      - name: Template-owned paths are unchanged
        run: make check-template

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Composition is reproducible
        run: make check-composition

      - name: Manifests are in sync
        run: |
          make compose
          make check-manifests

      - name: Composed build
        run: make build

      - name: Extension self-test lanes
        run: make test-extensions

      - name: Arch fitness over the composed tree
        run: make arch

      ## The two composed frontend lanes. They are HERE and not in ci.yml because
      ## they install the composed frontend workspace from scratch.
      - name: Unit screen suites (composed)
        run: make fe-test-ext

      - name: Composed typecheck
        run: make fe-typecheck-composed

      - name: Unit import allowlist
        run: make ext-imports

      ## Also in ci.yml, where it belongs — repeated here because this lane is
      ## the light set's SUPERSET, and a release that skipped a gate every pull
      ## request passed would be the one shape of drift this file exists to
      ## prevent.
      - name: Design-system gates over our units' screens
        run: make fe-ds-gates

      - name: Cache Go gate binaries
        id: gate-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin
          key: gate-tools-${{ runner.os }}-${{ hashFiles('core/backend/Makefile') }}

      - name: Install the pinned Go gate binaries
        if: steps.gate-tools.outputs.cache-hit != 'true'
        run: make core-backend-tools

      - name: Lint and format (extensions)
        run: make lint

      - name: Generated artifacts match their sources
        run: make drift

      - name: Documented make targets exist
        run: make check-docs

      ## The two database lanes, likewise here rather than in ci.yml: both arm a
      ## real Postgres cluster through `make db-up`.
      - name: Unit migration rules
        run: make check-ext-migrations

      - name: Unit migrations and integration tests (real database)
        run: make test-integration-ext

      - name: Staging script tests
        run: make test-scripts

      - name: No hardcoded credential reaches main
        run: make secret-scan

      - name: The secret gate still catches
        run: make test-secret-scan

      - name: core/ is pinned to a merged upstream commit
        run: make core-check-pin

      - name: core/ has no modifications and no staged residue
        run: |
          make unstage
          bash scripts/check-core-clean.sh
