# The release lane: a semver tag in, a finished release out.
#
# The ONLY lane that cuts a downloadable build, and one gesture starts it:
#
#   git tag -a v0.3.0 -m "..." && git push origin v0.3.0
#
# The tag says which shelf it lands on. A plain v0.3.0 ships; a suffixed
# v0.3.0-rc.1 publishes as a pre-release, so a build meant for testing does not
# become the download the release page offers by default. That is what retired
# the separate pre-release lane this repository used to carry: it answered "does
# this tree still build" against a tag that named nothing, which an -rc tag
# answers without a second workflow, a manual publish and a promotion to guard.
#
# An unverified release cannot exist here, because CI is the only thing that
# creates one and it creates it AFTER the gate. Prevention, rather than a
# complaint after the fact — and nothing here fires a `release` event, since a
# release created with CI's own GITHUB_TOKEN does not, so there is no way for
# this lane to retrigger anything, itself included.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

## Serialize, never cancel: by the publish job this workflow is creating a
## release and uploading assets to it, and a killed run leaves that half done.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ## Resolve and VALIDATE before spending ~20 minutes of runner time. Both
  ## checks below fail in seconds and say what to do instead.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          persist-credentials: false
          ## The ancestry check below needs main, and a tag push checks out one
          ## commit by default.
          fetch-depth: 0

      - name: The tag is a version, and it is on main
        id: v
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ## This tag IS the version. It names the build, the images, the zips
          ## and the release, and it is what a user quotes in a bug report —
          ## nothing derives it, so nothing catches a malformed one later. It is
          ## checked here with the release pattern (design Section 10, the same
          ## RELEASE_VERSION_RE scripts/lib.sh holds), and a v0.3, a v0.3.0.1 or
          ## a v0.3.0-beta.1 is refused rather than shipped.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "release: $TAG is not a release version." >&2
            echo "  Expected vMAJOR.MINOR.PATCH, optionally -rc.N (N >= 1)." >&2
            echo "  Delete the tag, and push one that names a version." >&2
            exit 1
          fi

          ## A release built from a commit that is not on main is a release
          ## nobody reviewed. The light gate runs on main, core-check-pin runs in
          ## it, and neither has seen a commit that never merged.
          ##
          ## origin/main is asserted SEPARATELY from the ancestry it feeds. The
          ## checkout above is credential-less by the time this step runs, so
          ## nothing here can fetch what is missing — and `merge-base` against a
          ## ref that does not exist fails exactly like a tag off main does. One
          ## message per cause, or a fetch-depth regression reads as "your tag is
          ## not on main" and sends somebody to re-merge work that is merged.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "release: origin/main is not in this checkout." >&2
            echo "  The ancestry check cannot run, so this refuses rather than" >&2
            echo "  passing blind. Check the checkout step's fetch-depth." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release: $TAG does not point at a commit on main." >&2
            echo "  Merge the work first, then tag the merge commit." >&2
            exit 1
          fi

          ## A -rc.N tag publishes as a pre-release, so v0.3.0-rc.1 does not
          ## become the download the release page offers by default. One tag
          ## grammar, two shelves.
          prerelease=false
          case "$TAG" in *-rc.*) prerelease=true ;; esac

          {
            echo "version=${TAG}"
            echo "ref=$(git rev-parse HEAD)"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "release: building ${TAG} (prerelease=${prerelease})" >> "$GITHUB_STEP_SUMMARY"

  full-check:
    needs: version
    uses: ./.github/workflows/full-check.yml
    with:
      ref: ${{ needs.version.outputs.ref }}

  ## The three role images (api, web, worker): built, smoke-tested, and pushed
  ## to the client's registry when the repository variable REGISTRY is set
  ## (design Section 9.2). Nothing is pushed unless the smoke test passed, and
  ## publish needs this job, so a failed smoke test also means no release.
  ##
  ## The smoke test needs the images in the local image store, which holds one
  ## platform, so the first build is linux/amd64 (the runner's own platform)
  ## with --load. The push is a second bake with --push for every platform in
  ## vars.PLATFORMS (default linux/amd64). It runs on the same builder, so the
  ## linux/amd64 layers come from the first build's cache rather than being
  ## built again. The docker-container builder is what makes bake's metadata
  ## file record the pushed digests, and QEMU runs the runtime stages of a
  ## foreign platform (core's Dockerfile cross-compiles its builder stages).
  ##
  ## The image list (one <repo>/<role>:<version>@<digest> line per role, or
  ## the not-pushed note) goes to publish as an ARTIFACT, not a job output:
  ## GitHub drops a job output that contains a secret's value, and an image
  ## name can contain the registry user name (docker.io/acme with user acme).
  images:
    needs: [version, full-check]
    runs-on: ubuntu-latest
    ## packages: write lets the workflow's own token push to GitHub Container
    ## Registry when REGISTRY is ghcr.io and no REGISTRY_PASSWORD is set.
    permissions:
      contents: read
      packages: write
    outputs:
      core: ${{ steps.core.outputs.core }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          submodules: recursive
          persist-credentials: false

      ## The setup full-check.yml uses for `make compose`, which `make package`
      ## runs first.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/backend/go.mod
          cache-dependency-path: core/backend/go.sum
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Core version
        id: core
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib.sh
          core="$(instance_get core)"
          echo "core=${core}" >> "$GITHUB_OUTPUT"

      - name: Build the images (linux/amd64, loaded locally)
        shell: bash
        env:
          PLATFORMS: linux/amd64
        run: make package VERSION="$VERSION"

      - name: Smoke test
        shell: bash
        run: make smoke VERSION="$VERSION"

      ## The all-in-one image (docs/superpowers/specs/2026-09-30-all-in-one-image-design.md).
      ## The dataset reaches it as it reaches the desktop lanes; without it the
      ## image has no demo data and says so.
      - name: Can the demo dataset be reached?
        id: dataset
        shell: bash
        env:
          KEY: ${{ secrets.DATASET_DEPLOY_KEY }}
          REPO: ${{ vars.DATASET_REPOSITORY }}
        run: |
          if [ -n "$KEY" ] && [ -n "$REPO" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no DATASET_REPOSITORY/DATASET_DEPLOY_KEY — the all-in-one image has no demo data"
          fi

      - name: Check out the demo dataset
        if: steps.dataset.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DATASET_REPOSITORY }}
          ssh-key: ${{ secrets.DATASET_DEPLOY_KEY }}
          path: .dataset
          persist-credentials: false

      - name: Build the all-in-one image (linux/amd64, loaded locally)
        shell: bash
        env:
          DATASET: ${{ steps.dataset.outputs.available == 'true' && '.dataset' || '' }}
        run: make aio VERSION="$VERSION"

      - name: Smoke test the all-in-one image
        shell: bash
        run: make aio-smoke VERSION="$VERSION"

      - name: Push the images
        id: push
        if: vars.REGISTRY != ''
        shell: bash
        env:
          PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIO_DATASET: ${{ steps.dataset.outputs.available == 'true' && '.dataset' || '' }}
        run: |
          set -euo pipefail
          ## docker login takes the registry host, without the path REGISTRY
          ## may carry. The credential is removed from the runner on every
          ## exit of this step, the failed push included.
          host="${REGISTRY%%/*}"
          trap 'docker logout "$host" >/dev/null 2>&1 || true' EXIT
          ## GitHub Container Registry without a stored secret: the workflow's
          ## own short-lived token (packages: write above).
          if [ "$host" = ghcr.io ] && [ -z "$REGISTRY_PASSWORD" ]; then
            REGISTRY_USERNAME="$GITHUB_ACTOR"
            REGISTRY_PASSWORD="$GHCR_TOKEN"
          fi
          printf '%s' "$REGISTRY_PASSWORD" \
            | docker login "$host" -u "$REGISTRY_USERNAME" --password-stdin
          metadata="$RUNNER_TEMP/bake-metadata.json"
          make package VERSION="$VERSION" PUSH=1 METADATA_FILE="$metadata"
          source scripts/lib.sh
          repo="$(image_repo)"
          mkdir -p "$RUNNER_TEMP/image-list"
          list="$RUNNER_TEMP/image-list/images.txt"
          : > "$list"
          for role in api web worker; do
            digest="$(jq -er --arg role "$role" '.[$role]."containerimage.digest"' "$metadata")"
            echo "${repo}/${role}:${VERSION}@${digest}" >> "$list"
          done
          aio_metadata="$RUNNER_TEMP/aio-metadata.json"
          DATASET="$AIO_DATASET" make aio VERSION="$VERSION" PUSH=1 METADATA_FILE="$aio_metadata"
          digest="$(jq -er '."containerimage.digest"' "$aio_metadata")"
          echo "${repo}/all-in-one:${VERSION}@${digest}" >> "$list"

      ## The public mirror (docs/release.md, Section 5): the pushed images
      ## copied, every platform and the same digests, to MIRROR_REGISTRY. Docker
      ## Hub allows one path level under a namespace, so a mirrored image is
      ## <MIRROR_REGISTRY>/<name>-<role>:<v>. The stacks pull from REGISTRY;
      ## the mirror is for discovery.
      - name: Mirror the images
        if: vars.REGISTRY != '' && vars.MIRROR_REGISTRY != ''
        shell: bash
        env:
          MIRROR_REGISTRY: ${{ vars.MIRROR_REGISTRY }}
          MIRROR_REGISTRY_USERNAME: ${{ secrets.MIRROR_REGISTRY_USERNAME }}
          MIRROR_REGISTRY_PASSWORD: ${{ secrets.MIRROR_REGISTRY_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          src_host="${REGISTRY%%/*}"
          mirror_host="${MIRROR_REGISTRY%%/*}"
          trap 'docker logout "$src_host" >/dev/null 2>&1 || true; docker logout "$mirror_host" >/dev/null 2>&1 || true' EXIT
          if [ "$src_host" = ghcr.io ] && [ -z "$REGISTRY_PASSWORD" ]; then
            REGISTRY_USERNAME="$GITHUB_ACTOR"
            REGISTRY_PASSWORD="$GHCR_TOKEN"
          fi
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$src_host" -u "$REGISTRY_USERNAME" --password-stdin
          printf '%s' "$MIRROR_REGISTRY_PASSWORD" | docker login "$mirror_host" -u "$MIRROR_REGISTRY_USERNAME" --password-stdin
          source scripts/lib.sh
          name="$(instance_get name)"
          mirror="$RUNNER_TEMP/image-list/mirror.txt"
          : > "$mirror"
          while IFS= read -r ref; do
            image="${ref%@*}"; image="${image%:*}"; role="${image##*/}"
            digest="${ref##*@}"
            target="${MIRROR_REGISTRY%/}/${name}-${role}:${VERSION}"
            docker buildx imagetools create --tag "$target" "$ref"
            echo "${target}@${digest}" >> "$mirror"
          done < "$RUNNER_TEMP/image-list/images.txt"

      - name: No registry
        if: vars.REGISTRY == ''
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/image-list"
          echo "images were not pushed: REGISTRY is not set" > "$RUNNER_TEMP/image-list/images.txt"

      - name: Image list to the job summary
        shell: bash
        run: |
          {
            echo "## Images"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/image-list/images.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: margince-images-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/image-list/
          if-no-files-found: error

      - name: Install scripts for testers
        shell: bash
        run: make aio-scripts VERSION="$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: margince-aio-scripts-${{ needs.version.outputs.version }}
          path: |
            dist/aio/${{ needs.version.outputs.version }}/install.sh
            dist/aio/${{ needs.version.outputs.version }}/install.ps1
          if-no-files-found: error

  ## Reusable lanes, called rather than copied, so the bundle a release ships is
  ## built by the same workflow a manual dispatch exercises. They gate on
  ## full-check deliberately: macOS minutes bill at ten times a Linux minute, and
  ## compiling PostgreSQL for a tree that fails lint is an expensive way to find
  ## that out.
  desktop-macos-apple-silicon:
    needs: [version, full-check]
    uses: ./.github/workflows/desktop-macos.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      version: ${{ needs.version.outputs.version }}
      arch: apple-silicon
    secrets:
      DATASET_DEPLOY_KEY: ${{ secrets.DATASET_DEPLOY_KEY }}

  ## The SAME lane, on an Intel runner. A macOS bundle is whatever machine built
  ## it, so this is the only way an Intel Mac gets a folder that starts at all.
  ##
  ## Gated on the Apple-silicon build rather than merely on full-check, which is
  ## the argument above applied once more: paying for a second macOS job — ten
  ## times a Linux minute — for a tree whose first macOS job just failed buys
  ## nothing. It is also the job with an end date. GitHub retires x86_64 on
  ## Actions in August 2027, so this is the one that will eventually fail for a
  ## reason outside this repository, and it should be the one that fails last.
  desktop-macos-intel:
    needs: [version, full-check, desktop-macos-apple-silicon]
    uses: ./.github/workflows/desktop-macos.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      version: ${{ needs.version.outputs.version }}
      arch: intel
    secrets:
      DATASET_DEPLOY_KEY: ${{ secrets.DATASET_DEPLOY_KEY }}

  desktop-windows:
    needs: [version, full-check]
    uses: ./.github/workflows/desktop-windows.yml
    with:
      ref: ${{ needs.version.outputs.ref }}
      version: ${{ needs.version.outputs.version }}
    secrets:
      DATASET_DEPLOY_KEY: ${{ secrets.DATASET_DEPLOY_KEY }}

  ## The release is created HERE, in one call, with all three bundles already in
  ## hand. There is no window in which the tag has a release that carries no
  ## download — which is the whole reason this lane exists rather than a person
  ## publishing first and CI catching up. A release that carries SOME of them is
  ## the same failure in a smaller size: the reader of the release page cannot
  ## tell a folder that is missing from one that was never built for their Mac.
  publish:
    needs: [version, full-check, images, desktop-macos-apple-silicon, desktop-macos-intel, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: margince-macos-apple-silicon-${{ needs.version.outputs.version }}
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: margince-macos-intel-${{ needs.version.outputs.version }}
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: margince-windows-${{ needs.version.outputs.version }}
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: margince-images-${{ needs.version.outputs.version }}
          path: image-list

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: margince-aio-scripts-${{ needs.version.outputs.version }}
          path: dist

      - name: Show what will be attached
        shell: bash
        run: ls -l dist

      ## The notes name what the release is made of: the core release, this
      ## repository's commit, and the pushed images by digest (or why none were
      ## pushed). GitHub's generated notes follow them.
      - name: Release notes
        shell: bash
        env:
          CORE_VERSION: ${{ needs.images.outputs.core }}
          COMMIT: ${{ needs.version.outputs.ref }}
          TAG: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ## The images job always writes this file: digest lines, or the
          ## not-pushed note. Missing or empty means something lost it, and a
          ## release whose notes silently list no images is refused.
          if [ ! -s image-list/images.txt ]; then
            echo "::error::image-list/images.txt is missing or empty; refusing to publish release notes without the image list"
            exit 1
          fi
          {
            echo "## Build"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Core | \`${CORE_VERSION}\` |"
            echo "| Instance commit | \`${COMMIT}\` |"
            echo
            echo "## Images"
            echo
            sed '/^$/d; s/^/- /' image-list/images.txt
            if [ -s image-list/mirror.txt ]; then
              echo
              echo "Docker Hub mirror (the same images):"
              echo
              sed '/^$/d; s/^/- /' image-list/mirror.txt
            fi
            ## The install scripts pull the pushed all-in-one image. Without a
            ## push, their image name has no registry and a tester's pull would
            ## go to the default public registry, so they are not offered.
            if ! grep -qF 'images were not pushed' image-list/images.txt; then
              echo
              echo "## Try it"
              echo
              echo "Testers start the all-in-one image with one command. It installs Docker when it is missing."
              echo
              echo "- macOS, Ubuntu: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh | sh\`"
              echo "- Windows (PowerShell): \`irm https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.ps1 | iex\`"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ## gh resolves the target repo from -R, then GH_REPO, then the git
          ## remote of the cwd. It does NOT read Actions' GITHUB_REPOSITORY, and
          ## this job never checks out.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          ## Idempotent on a re-run: a release may already exist if the publish
          ## step failed after creating it. Uploading with --clobber into the
          ## existing one is the recovery, rather than a red run nobody can
          ## clear without deleting the release by hand.
          ## The install scripts only when their image was pushed (see the notes).
          assets=(dist/*.zip)
          if ! grep -qF 'images were not pushed' image-list/images.txt; then
            assets+=(dist/install.sh dist/install.ps1)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release: $TAG already exists — replacing its assets and notes"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            ## Spelled as a conditional rather than `[ … ] && args+=(…)`. The
            ## AND-list form is safe here — `set -e` ignores a failing command
            ## that is not the last of an AND-OR list — but "safe once you
            ## re-derive that rule" is not what the last step before publishing
            ## should ask of a reader.
            args=(--title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag)
            if [ "$PRERELEASE" = true ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}" "${assets[@]}"
          fi

          echo "release: published $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json assets -q '.assets[].name' >> "$GITHUB_STEP_SUMMARY"
