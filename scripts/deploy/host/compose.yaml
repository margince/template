# compose.yaml — one Margince instance on one server (host adapter, design
# Section 9.6).
#
# Run from a release directory $HOST_DIR/releases/<v>/, which
# scripts/deploy/host/render.sh builds (with $HOST_DIR/shared/):
#
#   docker compose -p margince-<name> --env-file compose.env up -d --remove-orphans
#
# Files in the release directory:
#   .env                 read by the api and worker containers only, with
#                        `format: raw`: every value reaches the container exactly
#                        as written. Never an interpolation source: the Compose
#                        dotenv parser rejects a value that starts with a quote.
#   compose.env          the interpolation variables below; no secret.
#   config/margince.yaml mounted read-only into the api and worker.
#
# Files in ../../shared/ ($HOST_DIR/shared/), the same for every release:
#   db-init.sh, db-bootstrap.sql   the postgres first-start bootstrap
#   caddy/Caddyfile                the proxy configuration
# postgres and caddy mount only these and data.env, so their definitions do
# not change between releases and a deploy or a rollback does not recreate
# them. A changed Caddyfile is applied with
#   docker compose ... exec caddy caddy reload --config /etc/caddy/Caddyfile
# The caddy/ directory is mounted, not the file, so a Caddyfile replaced by a
# rename is still the file the container sees.
#   data.env             generated once on the server and kept across releases
#                        (mode 600, gen-env.sh data):
#                          POSTGRES_PASSWORD=<hex>
#                          MARGINCE_OWNER_DSN=postgres://margince_owner:<hex>@postgres:5432/margince
#                          MARGINCE_DSN=postgres://margince_app:<hex>@postgres:5432/margince
#                          MARGINCE_REDIS=redis:6379
#   instance.env         generated once on the server and kept across releases
#                        (mode 600, gen-env.sh instance; design Section 9.7):
#                          MARGINCE_KEYVAULT_ROOT_KEY=<base64 of 32 bytes>
#                          MARGINCE_CONNECTOR_STATE_KEY=<hex of 32 bytes>
#                          MARGINCE_WEBHOOK_KEY=<base64 of 32 bytes>
#                          MARGINCE_ADMIN_PASSWORD=<24 characters>  (only when
#                            secrets does not list MARGINCE_ADMIN_PASSWORD)
#                        Read by api and worker only.
#
# Interpolation variables (compose.env): INSTANCE_NAME, IMAGE_API, IMAGE_WEB, IMAGE_WORKER,
# HOST_DOMAIN, API_REPLICAS, WORKER_REPLICAS, COMPOSE_PROFILES.
#
# Precedence. The api and worker read data.env, then instance.env, then .env,
# all with `format: raw`; a later file overrides an earlier one, so a value
# the client lists in secrets (.env) wins over a generated one. An
# `environment:` entry below wins over all three files. data.env holds the
# addresses of the local postgres and redis services. .env holds MARGINCE_DSN,
# MARGINCE_OWNER_DSN and MARGINCE_REDIS only when they are external (RDS,
# ElastiCache): render.sh then writes them and sets COMPOSE_PROFILES empty, so
# the local-data services do not start. One definition of each service serves
# both cases.
#
# Database roles (core/docs/deployment.md, "The two-role database model"):
# postgres runs core's db-bootstrap.sql once, on an empty volume (db-init.sh),
# with the role passwords from data.env's DSNs. The api holds the owner DSN
# (its entrypoint migrates as the owner, then serves as the app role). The
# worker holds the app DSN only, and not the bootstrap admin password. Neither
# holds the superuser password. web holds no variable at all.
#
# File storage (core/docs/reference/configuration.md, "Object storage"). By
# default the api and worker use the filesystem store: render.sh writes
# MARGINCE_BLOBSTORE_PATH=/app/data/blobs to .env, and the named volume
# `blobs`, kept across releases, is mounted there. The image runs as the
# user app (uid 10001, core's Dockerfile) and has no /app/data, so Docker
# creates the mount point and a new volume owned by root; the one-shot
# service blobs-init chowns it to the image's app user (uid 10001) before
# the api and worker start. The blocks between the
# "default file store" markers are removed by
# render.sh when secrets lists MARGINCE_BLOBSTORE_ENDPOINT (S3 or
# compatible); the volume itself is not deleted.
#
# Order (core/docs/deployment.md, "Order of operations"): postgres and redis
# healthy, and blobs-init completed, then api, then worker and web once the
# api answers /readyz.

# The project name. The caller also passes -p margince-<name>; this line keeps
# the same project, and so the same volumes, if it does not.
name: margince-${INSTANCE_NAME:?INSTANCE_NAME is not set}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  restart: unless-stopped
  logging: *logging
  env_file:
    - path: ../../shared/data.env
      format: raw
    - path: ../../shared/instance.env
      format: raw
    - path: .env
      format: raw
  volumes:
    - ./config/margince.yaml:/app/config/margince.yaml:ro
    # >>> default file store
    - blobs:/app/data/blobs
    # <<< default file store

services:
  api:
    <<: *app
    image: ${IMAGE_API:?IMAGE_API is not set}
    deploy:
      replicas: ${API_REPLICAS:-1}
    environment:
      MARGINCE_CONFIG: /app/config/margince.yaml
      POSTGRES_PASSWORD: ""
    healthcheck:
      # /readyz: 200 once Postgres and Redis answer and the schema is current.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      # >>> default file store
      blobs-init:
        condition: service_completed_successfully
      # <<< default file store

  worker:
    <<: *app
    image: ${IMAGE_WORKER:?IMAGE_WORKER is not set}
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment:
      MARGINCE_CONFIG: /app/config/margince.yaml
      # The worker runs no migrations and holds no owner credential.
      MARGINCE_OWNER_DSN: ""
      MARGINCE_ADMIN_PASSWORD: ""
      POSTGRES_PASSWORD: ""
    depends_on:
      api:
        condition: service_healthy
      # >>> default file store
      blobs-init:
        condition: service_completed_successfully
      # <<< default file store

  web:
    image: ${IMAGE_WEB:?IMAGE_WEB is not set}
    restart: unless-stopped
    logging: *logging
    # No env_file: nginx serves the SPA and reads no variable (core lists
    # none for web), so web holds no secret.
    depends_on:
      api:
        condition: service_healthy

  # >>> default file store
  # One-shot: the blobs volume's root belongs to the app user (uid and gid
  # 10001 in core's api and worker images) with mode 700. No variable, no
  # network. `chown app:app`, not a hard-coded 10001:10001, so this tracks
  # whatever uid core's Dockerfile gives the app user (the name is resolved
  # inside the api image's own /etc/passwd, which core's Dockerfile creates
  # with `adduser -D -u 10001 app`).
  blobs-init:
    image: ${IMAGE_API:?IMAGE_API is not set}
    restart: "no"
    logging: *logging
    user: "0:0"
    network_mode: none
    entrypoint: ["sh", "-c", "chown app:app /app/data/blobs && chmod 700 /app/data/blobs"]
    volumes:
      - blobs:/app/data/blobs
  # <<< default file store

  postgres:
    image: pgvector/pgvector:pg16
    profiles: [local-data]
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: ../../shared/data.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../shared/db-init.sh:/docker-entrypoint-initdb.d/10-margince.sh:ro
      - ../../shared/db-bootstrap.sql:/margince/db-bootstrap.sql:ro
    healthcheck:
      # Over TCP: during initialization the server listens on the socket only.
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7
    profiles: [local-data]
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOST_DOMAIN: ${HOST_DOMAIN:?HOST_DOMAIN is not set}
    volumes:
      - ../../shared/caddy:/etc/caddy:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  # >>> default file store
  blobs:
  # <<< default file store
