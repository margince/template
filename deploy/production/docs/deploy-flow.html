<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margince deployment flow</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --active: #3fb950; --done: #238636;
    --aws: #ff9900; --azure: #0078d4; --light: #bc8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 8px; }
  .tab { padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px;
         background: var(--panel); color: var(--dim); cursor: pointer;
         font: inherit; }
  .tab.sel { color: var(--text); border-color: var(--accent); }
  #aws.tab.sel { border-color: var(--aws); }
  #azure.tab.sel { border-color: var(--azure); }
  #light.tab.sel { border-color: var(--light); }
  .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .controls button { padding: 6px 14px; border-radius: 6px; font: inherit;
                     border: 1px solid var(--line); background: var(--panel);
                     color: var(--text); cursor: pointer; }
  .controls button:hover { border-color: var(--accent); }
  #stepnum { color: var(--dim); min-width: 70px; text-align: right; }
  main { display: flex; flex-direction: column; height: calc(100vh - 57px); }
  #stage { flex: 1; }
  #caption { padding: 14px 20px; border-top: 1px solid var(--line);
             background: var(--panel); min-height: 64px; }
  #caption .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  color: var(--active); }
  #caption .steptitle { font-weight: 600; margin-bottom: 2px; }
  .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5;
               rx: 8; transition: stroke .3s, filter .3s; }
  .node text { fill: var(--text); font-size: 12px; }
  .node .sub { fill: var(--dim); font-size: 10px; }
  .node.on rect { stroke: var(--accent); filter: drop-shadow(0 0 6px #58a6ff88); }
  .node.done rect { stroke: var(--done); }
  .node.group rect { fill: none; stroke-dasharray: 5 4; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none;
          marker-end: url(#arrow); transition: stroke .3s; }
  .edge.on { stroke: var(--accent); stroke-dasharray: 6 4;
             animation: dash 1s linear infinite; }
  .edge.done { stroke: var(--done); }
  @keyframes dash { to { stroke-dashoffset: -10; } }
  .edgelabel { fill: var(--dim); font-size: 10px; }
  .packet { fill: var(--accent); filter: drop-shadow(0 0 4px var(--accent)); }
</style>
</head>
<body>
<header>
  <h1>Margince deployment flow</h1>
  <div class="tabs">
    <button class="tab" id="aws">AWS standard</button>
    <button class="tab" id="azure">Azure standard</button>
    <button class="tab" id="light">Light (host adapter)</button>
  </div>
  <div class="controls">
    <span id="stepnum"></span>
    <button id="prev">&#9664; Prev</button>
    <button id="play">&#9654; Play</button>
    <button id="next">Next &#9654;</button>
  </div>
</header>
<main>
  <svg id="stage" viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="caption"></div>
</main>

<script>
// Every flow: nodes carry a box position; steps light up nodes and draw a
// moving packet along one edge. Node type "group" is a dashed container.
const FLOWS = {

aws: {
  color: "var(--aws)",
  nodes: {
    ops:    { x:  60, y:  40, w: 190, label: "Operator", sub: "terraform + make" },
    tf:     { x:  60, y: 160, w: 190, label: "Terraform", sub: "deploy/production/aws/standard" },
    aws:    { x: 300, y:  30, w: 740, h: 380, label: "AWS account", group: 1 },
    ecr:    { x:  60, y: 380, w: 190, label: "Instance release images", sub: "api / web / worker · one release tag" },
    rds:    { x: 340, y: 210, w: 150, label: "RDS PostgreSQL 16", sub: "Multi-AZ" },
    cache:  { x: 340, y: 300, w: 150, label: "ElastiCache", sub: "Valkey 7.2" },
    efs:    { x: 540, y: 300, w: 150, label: "EFS", sub: "margince.yaml" },
    ssm:    { x: 540, y: 210, w: 150, label: "SSM Parameter Store", sub: "secrets, KMS" },
    opsbox: { x: 730, y:  90, w: 180, label: "Bootstrap host", sub: "temporary, SSM" },
    alb:    { x: 60,  y: 460, w: 190, label: "ALB + AWS WAF", sub: "ACM TLS" },
    ecs:    { x: 340, y: 460, w: 380, h: 140, label: "ECS Fargate (private subnets)", group: 1 },
    web:    { x: 370, y: 510, w: 100, label: "web", sub: "nginx SPA" },
    api:    { x: 500, y: 510, w: 100, label: "api", sub: ":8080" },
    worker: { x: 630, y: 510, w: 100, label: "worker" },
    users:  { x: 880, y: 470, w: 160, label: "Users", sub: "HTTPS" },
    gh:     { x: 60,  y: 300, w: 190, label: "Instance release.yml", sub: "core + units, smoke-test, push" },
  },
  edges: [
    ["ops","tf"], ["tf","rds"], ["tf","cache"], ["tf","ssm"],
    ["tf","efs"], ["tf","opsbox"],
    ["opsbox","rds"], ["gh","ecr"],
    ["opsbox","efs"], ["tf","alb"], ["tf","ecs"],
    ["ecr","web"], ["ecr","api"], ["ecr","worker"],
    ["users","alb"], ["alb","web"], ["alb","api"],
    ["api","rds"], ["worker","rds"], ["api","cache"], ["worker","cache"],
    ["api","ssm"], ["worker","ssm"], ["api","efs"],
  ],
  steps: [
    { t: "1. Provision the data plane", d: "terraform apply with -target creates RDS, ElastiCache, SSM parameters, EFS and the bootstrap host profile — but not the ECS services yet.", n: ["tf","rds","cache","ssm","efs","opsbox"], e: ["tf-rds","tf-cache","tf-ssm","tf-efs","tf-opsbox"], p: ["tf","rds"] },
    { t: "2. Bootstrap the database", d: "An SSM session on the temporary bootstrap host runs the SQL that creates the Margince roles and database in RDS.", n: ["opsbox","rds"], e: ["opsbox-rds"], p: ["opsbox","rds"] },
    { t: "3. Select instance release", d: "The instance's release.yml builds api, web and worker from core plus the instance's units, smoke-tests and pushes them. Terraform gets image_repo and release_version; later releases ship with make deploy. This stack does not rebuild them.", n: ["gh","ecr","tf"], e: ["gh-ecr"], p: ["ecr","tf"] },
    { t: "4. Upload margince.yaml", d: "The bootstrap host writes the instance config onto the EFS config volume.", n: ["opsbox","efs"], e: ["opsbox-efs"], p: ["opsbox","efs"] },
    { t: "5. Full apply", d: "terraform apply adds the ALB, WAF and the ECS services; tasks pull the instance release's images by tag over NAT.", n: ["alb","web","api","worker","ecr"], e: ["tf-alb","tf-ecs","ecr-web","ecr-api","ecr-worker"], p: ["ecr","api"] },
    { t: "6. Live", d: "Users reach the ALB over HTTPS; WAF filters, /v1 /oauth /mcp /webhooks go to api, the rest to web; api and worker use RDS, Valkey, SSM and EFS.", n: ["users","alb","web","api","worker","rds","cache"], e: ["users-alb","alb-web","alb-api","api-rds","worker-rds","api-cache","worker-cache","api-ssm","api-efs"], p: ["users","alb"] },
  ],
},

azure: {
  color: "var(--azure)",
  nodes: {
    ops:   { x:  60, y:  40, w: 190, label: "Operator", sub: "terraform + make" },
    tf:    { x:  60, y: 160, w: 190, label: "Terraform", sub: "deploy/production/azure/standard" },
    sub:   { x: 300, y:  30, w: 740, h: 400, label: "Subscription · VNet", group: 1 },
    gh:    { x:  60, y: 290, w: 190, label: "Instance release.yml", sub: "core + units, smoke-test, push" },
    reg:   { x:  60, y: 380, w: 190, label: "Instance release images", sub: "api / web / worker · one release tag" },
    kv:    { x: 340, y: 210, w: 150, label: "Key Vault", sub: "secrets + public-tls" },
    pg:    { x: 340, y: 320, w: 150, label: "Postgres Flexible", sub: "VNet-integrated" },
    files: { x: 540, y: 320, w: 150, label: "Azure Files", sub: "config, attachments" },
    jb:    { x: 540, y:  90, w: 150, label: "Jumpbox", sub: "optional, Bastion" },
    nat:   { x: 730, y: 320, w: 150, label: "NAT Gateway", sub: "fixed egress IP" },
    agw:   { x: 60,  y: 460, w: 190, label: "Application Gateway", sub: "WAF_v2, public IP" },
    env:   { x: 340, y: 470, w: 440, h: 190, label: "Container Apps environment (internal)", group: 1 },
    edge:  { x: 370, y: 520, w: 110, label: "edge", sub: "nginx :8081" },
    api:   { x: 510, y: 520, w: 100, label: "cmd/api", sub: ":8080" },
    worker:{ x: 640, y: 520, w: 100, label: "worker" },
    redis: { x: 370, y: 590, w: 110, label: "redis", sub: "internal :6379" },
    users: { x: 880, y: 480, w: 160, label: "Users", sub: "HTTPS" },
    ms:    { x: 880, y: 590, w: 160, label: "Graph + Dataverse" },
  },
  edges: [
    ["ops","tf"], ["tf","kv"], ["tf","pg"], ["tf","files"],
    ["tf","jb"], ["tf","nat"],
    ["gh","reg"], ["ops","kv"], ["tf","agw"], ["tf","env"],
    ["reg","nat"],
    ["users","agw"], ["agw","edge"], ["edge","api"],
    ["api","pg"], ["worker","pg"], ["api","redis"], ["worker","redis"],
    ["api","kv"], ["worker","kv"], ["api","files"], ["worker","files"],
    ["api","nat"], ["worker","nat"], ["nat","ms"],
  ],
  steps: [
    { t: "1. Provision the data plane", d: "terraform apply (deploy_apps=false) creates the network, Postgres, Key Vault, storage, NAT and the managed identities — the apps stay off until an image exists.", n: ["tf","kv","pg","files","nat","jb"], e: ["tf-kv","tf-pg","tf-files","tf-nat","tf-jb"], p: ["tf","pg"] },
    { t: "2. Select instance release", d: "The instance's release.yml builds api, web and worker from core plus the instance's units, smoke-tests and pushes them. Terraform gets image_repo and release_version; later releases ship with make deploy. This stack does not rebuild them.", n: ["gh","reg","tf"], e: ["gh-reg"], p: ["reg","tf"] },
    { t: "3. Import the TLS certificate", d: "The public certificate for public_base_url is imported into Key Vault as public-tls; the gateway's identity may read only that secret.", n: ["ops","kv"], e: ["ops-kv"], p: ["ops","kv"] },
    { t: "4. deploy_apps", d: "terraform apply with deploy_apps=true creates the environment, the api, worker and redis apps, the App Gateway and its WAF policy; the apps pull the instance release's images by tag over the NAT gateway.", n: ["agw","edge","api","worker","redis","reg","nat"], e: ["tf-agw","tf-env","reg-nat"], p: ["reg","nat"] },
    { t: "5. Live", d: "HTTPS lands on the gateway's public IP; WAF rules run, TLS ends on the public-tls cert, and the gateway forwards to the edge on the internal environment.", n: ["users","agw","edge","api"], e: ["users-agw","agw-edge","edge-api"], p: ["users","agw"] },
    { t: "6. Data and egress", d: "api and worker reach Postgres, Redis, Key Vault and Azure Files inside the VNet; outbound calls to Graph and Dataverse leave through the NAT Gateway's fixed IP.", n: ["api","worker","pg","redis","kv","files","nat","ms"], e: ["api-pg","worker-pg","api-redis","worker-redis","api-kv","api-files","api-nat","worker-nat","nat-ms"], p: ["api","nat"] },
  ],
},

light: {
  color: "var(--light)",
  nodes: {
    ops:  { x:  60, y:  40, w: 190, label: "Operator", sub: "terraform + make" },
    tf:   { x:  60, y: 160, w: 190, label: "Terraform", sub: "aws/light or azure/light" },
    dns:  { x:  60, y: 300, w: 190, label: "DNS provider", sub: "A record" },
    cloud:{ x: 300, y:  30, w: 740, h: 440, label: "One VPC / VNet", group: 1 },
    vm:   { x: 340, y:  90, w: 660, h: 340, label: "VM (Ubuntu 24.04) — host adapter installs Docker", group: 1 },
    disk: { x: 830, y: 140, w: 150, label: "Data disk", sub: "/var/lib/docker" },
    caddy:{ x: 370, y: 150, w: 130, label: "Caddy", sub: ":80/:443 auto HTTPS" },
    nginx:{ x: 370, y: 250, w: 130, label: "nginx", sub: "routing, auth limits" },
    web:  { x: 560, y: 240, w: 120, label: "web", sub: "SPA" },
    api:  { x: 560, y: 330, w: 120, label: "api", sub: ":8080" },
    worker:{x: 720, y: 330, w: 120, label: "worker" },
    pgc:  { x: 700, y: 240, w: 140, label: "PostgreSQL 16", sub: "container" },
    rdc:  { x: 700, y: 140, w: 140, label: "Redis 7.2", sub: "container" },
    vault:{ x: 340, y: 500, w: 200, label: "SSM / Key Vault", sub: "license, operator-only" },
    bkup: { x: 600, y: 500, w: 200, label: "Backups", sub: "DLM snapshots / Azure Backup" },
    users:{ x: 60,  y: 500, w: 190, label: "Users", sub: "HTTPS" },
    reg:  { x: 880, y: 500, w: 160, label: "Registry", sub: "make release images" },
  },
  edges: [
    ["ops","tf"], ["tf","vm"], ["dns","caddy"], ["ops","vm"],
    ["reg","api"], ["caddy","nginx"], ["nginx","web"], ["nginx","api"],
    ["api","pgc"], ["worker","pgc"], ["api","rdc"], ["worker","rdc"],
    ["pgc","disk"], ["rdc","disk"], ["api","disk"],
    ["users","caddy"], ["ops","vault"], ["vm","bkup"],
  ],
  steps: [
    { t: "1. Provision the VM", d: "terraform apply creates the VPC/VNet, one VM with a static public IP and a separate data disk, the operator-only secret store and the backup policy.", n: ["tf","vm","disk","vault","bkup"], e: ["tf-vm"], p: ["tf","vm"] },
    { t: "2. DNS", d: "An A record points the domain at the VM's public IP; Caddy needs it for the Let's Encrypt challenge.", n: ["dns","caddy"], e: ["dns-caddy"], p: ["dns","caddy"] },
    { t: "3. Install Docker", d: "make host-bootstrap runs over SSH (ssh_allowed_cidrs) and installs Docker Engine and Compose on the VM.", n: ["ops","vm"], e: ["ops-vm"], p: ["ops","vm"] },
    { t: "4. Deploy", d: "make deploy VERSION=<v> pulls the release images and starts Compose: Caddy → nginx → web/api/worker, with Postgres 16 and Redis 7.2 containers on the data disk.", n: ["reg","caddy","nginx","web","api","worker","pgc","rdc","disk"], e: ["reg-api","caddy-nginx","nginx-web","nginx-api","api-pgc","api-rdc","worker-pgc","pgc-disk"], p: ["reg","api"] },
    { t: "5. Live", d: "Users reach Caddy over HTTPS; nginx routes the SPA to web and /v1 /webhooks /oauth /mcp to api. Daily disk backup keeps 7 restore points.", n: ["users","caddy","nginx","web","api","bkup"], e: ["users-caddy","caddy-nginx","nginx-web","nginx-api","vm-bkup"], p: ["users","caddy"] },
  ],
},
};

const stage = document.getElementById("stage");
const caption = document.getElementById("caption");
const stepnum = document.getElementById("stepnum");
const NS = "http://www.w3.org/2000/svg";
let flow = "aws", step = 0, timer = null;

const NH = 56; // node box height
function center(f, id) {
  const n = FLOWS[f].nodes[id];
  return [n.x + n.w / 2, n.y + (n.h || NH) / 2];
}
function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function render() {
  const F = FLOWS[flow];
  stage.innerHTML = "";
  const defs = el("defs", {});
  defs.innerHTML = `<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>`;
  stage.appendChild(defs);

  const edgeEls = {};
  for (const [a, b] of F.edges) {
    if (F.nodes[a].hide || F.nodes[b].hide) continue;
    const [x1, y1] = center(flow, a), [x2, y2] = center(flow, b);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const l = Math.hypot(dx, dy) || 1;
    const p = el("path", { d: `M${x1 + dx * 0.12},${y1 + dy * 0.12} Q${mx - dy * 0.08},${my + dx * 0.08} ${x2 - dx * 0.12},${y2 - dy * 0.12}`,
                           class: "edge", id: `e-${a}-${b}` });
    stage.appendChild(p);
    edgeEls[`${a}-${b}`] = p;
  }
  for (const id in F.nodes) {
    const n = F.nodes[id];
    if (n.hide) continue;
    const g = el("g", { class: "node" + (n.group ? " group" : ""), id: `n-${id}` });
    g.appendChild(el("rect", { x: n.x, y: n.y, width: n.w, height: n.h || NH }));
    const t = el("text", { x: n.x + n.w / 2, y: n.y + (n.group ? 18 : 24), "text-anchor": "middle" });
    t.textContent = n.label;
    g.appendChild(t);
    if (n.sub && !n.group) {
      const s = el("text", { x: n.x + n.w / 2, y: n.y + 40, "text-anchor": "middle", class: "sub" });
      s.textContent = n.sub;
      g.appendChild(s);
    }
    stage.appendChild(g);
  }
  apply();
}

function apply() {
  const F = FLOWS[flow], s = F.steps[step];
  stage.querySelectorAll(".node").forEach(g => {
    g.classList.remove("on", "done");
    if (s.n.includes(g.id.slice(2))) g.classList.add("on");
  });
  stage.querySelectorAll(".edge").forEach(p => p.classList.remove("on", "done"));
  // Mark edges from earlier steps as done.
  for (let i = 0; i < step; i++)
    for (const eid of F.steps[i].e) {
      const p = stage.getElementById(`e-${eid}`);
      if (p) p.classList.add("done");
    }
  stage.querySelectorAll(".packet").forEach(p => p.remove());
  for (const eid of s.e) {
    const p = stage.getElementById(`e-${eid}`);
    if (!p) continue;
    p.classList.add("on");
  }
  if (s.p) {
    const [a, b] = s.p;
    if (!F.nodes[a].hide && !F.nodes[b].hide) {
      const [x1, y1] = center(flow, a), [x2, y2] = center(flow, b);
      const c = el("circle", { r: 5, class: "packet", cx: x1, cy: y1 });
      c.innerHTML = `<animate attributeName="cx" from="${x1}" to="${x2}" dur="1.2s" repeatCount="indefinite"/>
                     <animate attributeName="cy" from="${y1}" to="${y2}" dur="1.2s" repeatCount="indefinite"/>`;
      stage.appendChild(c);
    }
  }
  caption.innerHTML = `<div class="steptitle">${s.t}</div><div>${s.d}</div>`;
  stepnum.textContent = `${step + 1} / ${F.steps.length}`;
}

function go(d) {
  const F = FLOWS[flow];
  step = Math.min(F.steps.length - 1, Math.max(0, step + d));
  apply();
}
function stop() { clearInterval(timer); timer = null;
                  document.getElementById("play").innerHTML = "&#9654; Play"; }
document.getElementById("play").onclick = () => {
  if (timer) return stop();
  if (step === FLOWS[flow].steps.length - 1) { step = 0; apply(); }
  document.getElementById("play").innerHTML = "&#9646;&#9646; Pause";
  timer = setInterval(() => {
    if (step >= FLOWS[flow].steps.length - 1) return stop();
    go(1);
  }, 2600);
};
document.getElementById("next").onclick = () => { stop(); go(1); };
document.getElementById("prev").onclick = () => { stop(); go(-1); };
for (const id in FLOWS) {
  document.getElementById(id).onclick = () => {
    stop(); flow = id; step = 0;
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("sel"));
    document.getElementById(id).classList.add("sel");
    render();
  };
}
document.getElementById("aws").classList.add("sel");
render();
</script>
</body>
</html>
