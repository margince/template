# yaml-language-server: $schema=../../../core/config/margince.schema.json
#
# deploy/production/config/margince.yaml — this environment's installation
# configuration (core/config/margince.schema.json), mounted read-only into
# the api and worker containers. Consumed once, at first boot against an
# empty database; Settings edits these values afterwards. See
# core/config/margince.example.yaml and core/docs/deployment.md for the full
# reference.
version: 1

workspace:
  name: "Margince Default" # change this — the workspace name shown in the app
  base_currency: EUR                  # change this — the ISO 4217 code deals convert against
  timezone: UTC                       # change this — the IANA timezone name

bootstrap_admin:
  email: "admin@example.com" # change this — the placeholder admin email; the host adapter refuses to deploy until it is set
  display_name: Admin
  # Read at boot from /app/secrets/admin-password (the api's working
  # directory is /app; core/docs/deployment.md, "First-boot bootstrap
  # config"). The generated password lands there from shared/instance.env on
  # the server, unless you list MARGINCE_ADMIN_PASSWORD in
  # deploy/production/secrets.
  password_file: secrets/admin-password

# Remote MCP connector (design Section 5.5, Gate 1). Off: turning it on
# exposes an internet-facing authorization server and the agent tool
# surface, which is an explicit operator decision.
mcp:
  connector_enabled: false

# The tier→model binding (optional). Consumed once, at first boot against an
# empty database; Settings → AI re-points a lane afterwards without a restart.
#
# Every lane rides OpenRouter: one OPENAI_COMPATIBLE_API_KEY reaches Anthropic's
# catalogue, so the installation needs a single BYOK credential rather than one
# per vendor. `base_url` is the broker's host root — the adapter appends /v1.
#
# List OPENAI_COMPATIBLE_API_KEY in deploy/production/secrets, or put the key in
# under Settings → AI → Model provider keys after first boot. Never write a key
# into this file: the vault is the key's home, this file is committed.
#
# Tiers with no `routing:` inherit the product default (sort: throughput,
# quantizations: [fp16, bf16], require_parameters: true), which filters out
# quantized servings of a model bound for its quality. frontier writes the
# block out to refuse quantized endpoints without sorting for speed — a
# frontier answer is worth waiting for.
#
# cloud_frontier, not eu_hosted: no Claude model has an EU-region endpoint on
# OpenRouter, so nothing here keeps text in the EU. For an EU-residency
# deployment, bind the lanes to a provider with an EU endpoint instead.
#
# Known gap: the openai_compatible wire cannot declare a PDF, so a task that
# hands a whole PDF to the model (document_extract) is refused by the adapter.
# Rebind that tier to a provider whose wire carries PDFs if needed.
seeds:
  ai_routing:
    profile: cloud_frontier     # eu_hosted | sovereign | cloud_frontier
    tiers:
      local_small:
        provider: openai_compatible
        model: anthropic/claude-haiku-4.5
        base_url: https://openrouter.ai/api
      cheap_cloud:
        provider: openai_compatible
        model: anthropic/claude-haiku-4.5
        base_url: https://openrouter.ai/api
      premium:
        provider: openai_compatible
        model: anthropic/claude-sonnet-4.6
        base_url: https://openrouter.ai/api
      frontier:
        provider: openai_compatible
        model: anthropic/claude-opus-4.5
        base_url: https://openrouter.ai/api
        routing:
          quantizations: [fp16, bf16, fp32]
          require_parameters: true
    # Anthropic serves no embedding model; the lane rides the same broker and
    # key on Mistral's. dimensions must equal the model's native width — the
    # openai_compatible adapter never sends it.
    embeddings:
      provider: openai_compatible
      model: mistralai/mistral-embed-2312
      base_url: https://openrouter.ai/api
      dimensions: 1024

# Outbound transactional email (password reset). Off until you set an SMTP
# relay: uncomment enabled and smtp below.
email:
  enabled: false
  # smtp:
  #   host: smtp.example.test
  #   port: 587
  #   username: <smtp-username>
  #   password: ${env:MARGINCE_SMTP_PASSWORD}
  #   from_address: noreply@example.com
